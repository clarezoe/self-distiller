<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Offline - Self Distiller</title>
<style>
body{margin:0;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#fff;color:#171717}
@media(prefers-color-scheme:dark){body{background:#0a0a0a;color:#ededed}}
main{max-width:22rem;text-align:center}
button{min-height:44px;padding:0 20px;font-size:16px;border-radius:8px;border:0;background:#171717;color:#fff}
@media(prefers-color-scheme:dark){button{background:#fff;color:#171717}}
</style>
</head>
<body>
<main>
<h1>You are offline</h1>
<p>Self Distiller needs a connection to load your workspace. Your data is not stored on this device. 你目前处于离线状态，请联网后重试。</p>
<button type="button" onclick="location.reload()">Retry / 重试</button>
</main>
</body>
</html>
